services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sadep
      POSTGRES_PASSWORD: sadep_local_dev
      POSTGRES_DB: sadep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadep -d sadep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
