name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck backend
        run: npm run typecheck --workspace @sadep/backend

      - name: Typecheck frontend
        run: npm run typecheck --workspace @sadep/frontend

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      FRONTEND_ORIGIN: http://localhost:5000
      JWT_SECRET: ci-jwt-secret-placeholder-min-32-chars-ok
      REFRESH_TOKEN_HMAC_SECRET: ci-refresh-secret-placeholder-32-chars
      ACCESS_TOKEN_TTL: 1h
      REFRESH_TOKEN_TTL: 7d
      REFRESH_COOKIE_NAME: aep_pa_refresh
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ''
      COOKIE_PATH: /auth
      DEV_SEED_PASSWORD: ci-seed-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Backend unit tests
        run: npm run test:unit --workspace @sadep/backend

      - name: Frontend tests
        run: npm run test:run --workspace @sadep/frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    env:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      FRONTEND_ORIGIN: http://localhost:5000
      JWT_SECRET: ci-jwt-secret-placeholder-min-32-chars-ok
      REFRESH_TOKEN_HMAC_SECRET: ci-refresh-secret-placeholder-32-chars
      ACCESS_TOKEN_TTL: 1h
      REFRESH_TOKEN_TTL: 7d
      REFRESH_COOKIE_NAME: aep_pa_refresh
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ''
      COOKIE_PATH: /auth
      DEV_SEED_PASSWORD: ci-seed-placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build backend
        run: npm run backend:build

      - name: Build frontend
        run: npm run frontend:build
